name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure git credentials for SwiftPM
        run: gh auth setup-git

      - name: Build
        run: swift build -c release

      - name: Self-test
        run: .build/release/mackey selftest

      - name: Package DMG (ad-hoc)
        run: ./scripts/package-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MacKey68-dmg
          path: dist/*.dmg
          if-no-files-found: error
